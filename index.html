<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Cuidado</title>
<style>
  :root { color-scheme: light dark; --fundo: #F6F4EF; --texto: #2F3A2A; --apoio: #6B6A63; --verde: #4A5541; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #1C1F1A; --texto: #E8E6DF; --apoio: #A9A79E; --verde: #A9B89A; } }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 32px 0 8px; color: var(--verde); }
  .data { color: var(--apoio); margin: 0 0 24px; }
  .resumo { border-left: 4px solid var(--verde); padding: 4px 0 4px 16px; }
  a { color: var(--verde); }
</style>
</head>
<body><main>
<h1>Plano de Cuidado</h1>
<p>O Plano de Cuidado guarda seus dados só neste aparelho. O app não tem conta, não tem servidor e não acessa a internet. Seus dados só saem do aparelho quando você mesmo envia um arquivo ou um e-mail, por exemplo à sua médica.</p>
<p><a href="privacidade/">Política de Privacidade</a></p>
</main></body>
</html>
